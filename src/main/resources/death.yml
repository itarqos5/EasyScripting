# What the server does with a player who dies: normal, spectator or respawn. Kicking is the
# separate kick-on-death below, set in game with /es deathkick; 'kick' here is now read as normal.
default-mode: normal
# Still consume Curse of Vanishing items when keep-inventory is enabled.
keep-inventory-respects-vanishing: true
# Death-message audience: -1 normal broadcast, 0 suppress, positive values are a same-world radius in blocks.
message-radius: -1
# Permission required for automatic spectator mode on death.
spectator-permission: easyscripting.death.spectator
# Kick every player who dies. The death happens first. /es deathkick on|off writes this key.
kick-on-death: true
# Ticks between the death and the kick, so the player visibly dies and the death message lands first (1..200).
kick-delay-ticks: 20
# Seconds a player kicked for dying cannot rejoin; 60 is one minute and 0 lets them come straight
# back (0..86400). /es deathkick cooldown <length|off> writes this key in game.
rejoin-lockout-seconds: 60
# Permission that exempts a player from the death kick. Nobody holds it by default, operators included.
kick-bypass-permission: easyscripting.death.kick.bypass
# MiniMessage text sent when the configured death mode kicks a player. <seconds> is the rejoin wait.
kick-message: '<gray>Your part in this take is complete. Join again in <white><seconds></white> seconds.'
# MiniMessage text shown to a player whose rejoin is refused. <seconds> is the whole seconds left.
lockout-message: '<red>You died. You can join again in <white><seconds></white> seconds.'
# Obfuscate an invisible player's name in their death, kill and leave messages: names, message or off.
invisible-obfuscation: names
