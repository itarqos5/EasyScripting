# Internal file-format version; keep the shipped value.
schema: 1
# Use Random User v1.4 for temporary real-player nickname candidates.
# No Minecraft player identity/client address is placed in the request; the provider sees the
# server's ordinary network connection. Results use the same rules as generated actor names:
# 5..16 characters, a letter plus a digit/underscore, and no current actor/nickname,
# blacklisted/dead identity, known joined real account, or current operator name.
api-enabled: true
# Maximum wait for the username HTTP request, in milliseconds (500..10000).
api-timeout-millis: 4000
# Use lower-case fragments from npc-identities.yml when the API is disabled or unavailable.
local-fallback: true
# Also give the player a random public skin when a nickname is applied, drawn from the same
# cached skin-owner pool that generated actor identities use, falling back to the
# npc-identities.yml skin-owners list when the pool is empty and local-fallback is on.
# Blacklisted, retired and the player's own account name are never chosen. The lookup is
# asynchronous: if it fails the nickname still applies and the current skin is kept.
# Set false to keep the player's own skin under the alias.
random-skin: true
# Names and skins are temporary for the current connection; the next join uses the real account.
