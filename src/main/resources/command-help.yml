  - syntax: "/es chat block off"
    description: "Unblock ordinary public chat and announce it."
    example: "/es chat block off"
  - syntax: "/es chat clear"
    description: "Send blank lines to everyone's chat. Does not delete server logs."
    example: "/es chat clear"
  - syntax: "/es chat clear all"
    description: "Send blank lines to everyone's chat. Does not delete server logs."
    example: "/es chat clear"
  - syntax: "/es chat clear self"
    description: "Clear only your visible chat area."
