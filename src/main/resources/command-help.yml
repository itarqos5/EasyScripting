# Command syntax help shown after an invalid or incomplete command.
# Edit descriptions/examples to localize. Regenerate defaults with scripts/update-command-help.py.
# syntax uses <required>, [optional], and | for alternatives; keep the command words intact.
# description explains the effect; example is one complete command the player can adapt.
schema: 1
commands:
  - syntax: "/es"
    description: "Open the main studio GUI."
    example: "/es"
  - syntax: "/es menu actors"
    description: "Open the NPC library directly."
    example: "/actors"
  - syntax: "/es kits"
    description: "Open the library; non-operators see only kits they may claim."
    example: "/es kits"
  - syntax: "/es deadusers"
    description: "Open the paginated Dead Users GUI. It shows saved heads, usernames, kind, owner and death time."
    example: "/deadusers list"
  - syntax: "/es help"
    description: "Show command groups you have permission to use. Use this guide for their individual options."
    example: "/es help"
  - syntax: "/es menu [name]"
    description: "Open the main menu or a named page."
    example: "/es menu actors"
  - syntax: "/es status"
    description: "Show plugin version, loaded scene/NPC counts, active jobs and voice availability."
    example: "/es status"
  - syntax: "/es features"
    description: "Open feature switches."
    example: "/es features"
  - syntax: "/es features <feature>"
    description: "Toggle that feature ON/OFF and save the setting. It toggles; there is no separate on/off argument."
    example: "/es features effects"
  - syntax: "/es permissions <feature> <everyone|permission.node>"
    description: "Change which permission is needed for an editable feature."
    example: "/es permissions warp everyone"
  - syntax: "/es reload"
    description: "Validate and reload configuration/GUI YAML; close open studio menus. Invalid configuration keeps the previous settings."
    example: "/es reload"
  - syntax: "/es actor"
    description: "List saved actor IDs."
    example: "/actor list"
  - syntax: "/es actor list"
    description: "List saved actor IDs."
    example: "/actor list"
  - syntax: "/es actor create <id> [type]"
    description: "Create an NPC at your location. Default type is PLAYER; a unique generated username and skin are chosen automatically."
    example: "/actor create guard"
  - syntax: "/es actor info <id>"
    description: "Show its name, skin owner, entity type, selected recording, mode, autoplay and combat settings."
    example: "/actor info guard"
  - syntax: "/es actor gui <id> [section]"
    description: "Open its GUI. Sections: overview, appearance, movement, acting, combat."
    example: "/actor gui guard combat"
  - syntax: "/es actor randomize <id>"
    description: "Choose another name and PLAYER skin; retain the same ID and equipment. Works during replay."
    example: "/actor randomize guard"
  - syntax: "/es actor set <id> <setting> <value>"
    description: "Change one setting; see the complete list below."
    example: "/actor set guard name RiverScout"
  - syntax: "/es actor here <id>"
    description: "Teleport the actor to you."
    example: "/actor here guard"
  - syntax: "/es actor move <id> [speed]"
    description: "Make it navigate to where you are standing. Speed 0.1–5; default 1."
    example: "/actor move guard 1.2"
  - syntax: "/es actor copy <source> <new-id>"
    description: "Create a copy at your location, retaining appearance and equipment."
    example: "/actor copy guard guard_copy"
  - syntax: "/es actor hide <id>"
    description: "Remove its visible entity while keeping the saved actor."
    example: "/actor hide guard"
  - syntax: "/es actor show <id>"
    description: "Show a hidden actor again; autoplay may start."
    example: "/actor show guard"
  - syntax: "/es actor respawn <id>"
    description: "Recreate an existing actor at its saved spawn. It cannot restore an actor deleted by death."
    example: "/actor respawn guard"
  - syntax: "/es actor deleteall"
    description: "Permanently delete every NPC on the server. Group definitions and their settings are kept. Operators only."
    example: "/actor deleteall"
  - syntax: "/es actor delete <id>"
    description: "Remove the actor and its active saved definition."
    example: "/actor delete guard_copy"
  - syntax: "/es actor attack <id> <online-player> [damage]"
    description: "Face the player, swing and deal damage once. Must be within 6 blocks; damage defaults to 1, range 0–1000."
    example: "/actor attack guard Alex 2"
  - syntax: "/es actor kit <id> <kit>"
    description: "Give it the saved kit and save its equipment. Actual operators only; stop an active replay first."
    example: "/actor kit guard starter"
  - syntax: "/es actor pattern <group> <line|circle|disc|grid|square> <front|behind> <count> <kit> [spacing] [type]"
    description: "Create 1–200 equipped members of an existing managed group. Disc/square are filled; every X/Z column uses its highest safe ground. Spacing defaults to 2 blocks (1–20); type defaults to PLAYER."
    example: "/actor pattern red disc behind 40 fighter 2 PLAYER"
  - syntax: "/es actor all <group|*> <setting> <value>"
    description: "Change a setting for a group, or every actor with *."
    example: "/actor all extras look on"
  - syntax: "/es actor group <group|*> <hide|show|respawn|jump>"
    description: "Run that operation for the group/every actor."
    example: "/actor group extras jump"
  - syntax: "/es actor group <group|*> kit <kit>"
    description: "Give a kit to the group/every actor. Actual operators only."
    example: "/actor group extras kit starter"
  - syntax: "/es actor act <id> [recording-id]"
    description: "Put you in the NPC's place, identity and costume, then record your movement, equipment and animations. Omit the recording ID to generate one."
    example: "/actor act guard entrance"
  - syntax: "/es actor finish"
    description: "Finish your acting, save the performance, restore you and start autoplay if enabled."
    example: "/actor finish"
  - syntax: "/es actor cancel"
    description: "Discard the current acting session and restore you."
    example: "/actor cancel"
  - syntax: "/es actor recording <id> <recording-id>"
    description: "Select an existing recording for an available actor."
    example: "/actor recording guard entrance"
  - syntax: "/es actor play <id>"
    description: "Play its selected recording using its selected mode."
    example: "/actor play guard"
  - syntax: "/es actor stop <id>"
    description: "Stop at its current position; turn off autoplay/wandering and keep damage already taken."
    example: "/actor stop guard"
  - syntax: "/es actor mode <id> stop"
    description: "Play once, then stay at the last recorded position."
    example: "/actor mode guard stop"
  - syntax: "/es actor mode <id> repeat"
    description: "At the end, teleport back to the recording start and play again forever."
    example: "/actor mode guard repeat"
  - syntax: "/es actor mode <id> reverse"
    description: "Play forward, then backward, continuing back and forth."
    example: "/actor mode guard reverse"
  - syntax: "/es actor autoplay <id> on"
    description: "Automatically start the selected take when eligible, including after acting save, load, show or respawn."
    example: "/actor autoplay guard on"
  - syntax: "/es actor autoplay <id> off"
    description: "Disable future automatic starts; an already-running replay continues until stopped."
    example: "/actor autoplay guard off"
  - syntax: "/es group"
    description: "Open your NPC groups."
    example: "/es group"
  - syntax: "/es group gui [group]"
    description: "Open the group library or one group's controls."
    example: "/es group gui red"
  - syntax: "/es group list"
    description: "List groups you can direct."
    example: "/es group list"
  - syntax: "/es group create <group>"
    description: "Create a faction; adopt existing actors with the same group tag. Operators only."
    example: "/es group create red"
  - syntax: "/es group delete <group>"
    description: "Permanently delete the faction and every NPC in it. Manual group deletion does not add their names to Dead Users. Operators only."
    example: "/es group delete red"
  - syntax: "/es group info <group>"
    description: "Print leader, member count, order, Intelligence, shared settings and active enemies."
    example: "/es group info red"
  - syntax: "/es group add <group> <actor>"
    description: "Add or transfer one existing actor. It keeps individual state unless this group has a shared kit/Immortal value, which is applied. Operators only."
    example: "/es group add red guard"
  - syntax: "/es group add <group> tag:<old-group>"
    description: "Transfer all actors with an existing tag; this group's shared kit/Immortal values apply when configured. Operators only."
    example: "/es group add red tag:guards"
  - syntax: "/es group remove <group> <actor>"
    description: "Remove an NPC from the faction without deleting it. Operators only."
    example: "/es group remove red guard"
  - syntax: "/es group leader <group> <online-player>"
    description: "Assign a real account name as leader and begin following. Operators only."
    example: "/es group leader red Alex"
  - syntax: "/es group leader <group> off"
    description: "Clear its leader and hold position. Operators only."
    example: "/es group leader red off"
  - syntax: "/es group intelligence <group> on|off"
    description: "ON enables coordinated attacks and defensive combat reactions. OFF follows movement orders only; automatic totem handling is separate. Operators only."
    example: "/es group intelligence red on"
  - syntax: "/es group immortal <group> on|off"
    description: "Set Immortal for all current members and remember the setting for actors added or created later. Operators only."
    example: "/es group immortal red on"
  - syntax: "/es group kit <group> <kit>"
    description: "Apply one saved kit to every available current member and remember it for actors later transferred with group add. Pattern/tool members always receive their explicitly required kit. Operators only."
    example: "/es group kit red fighter"
  - syntax: "/es group identities <group>"
    description: "Give every current member a fresh unused username and skin, including actors that are already moving or replaying. Operators only."
    example: "/es group identities red"
  - syntax: "/es group tool <group> <kit> [type]"
    description: "Give yourself a persistent item bound to the group, required kit and optional living entity type. Right-click a block to create the next equipped member. Operators only."
    example: "/es group tool red fighter PLAYER"
  - syntax: "/es group follow <group>"
    description: "Clear current attacks and follow the leader in compact rows behind their movement direction; the leader's later hits add enemies."
    example: "/es group follow red"
  - syntax: "/es group hold <group>"
    description: "Clear orders and stop at current positions. Intelligent groups can still defend themselves if attacked."
    example: "/es group hold red"
  - syntax: "/es group stop <group>"
    description: "Same as hold. Use Intelligence OFF as well to stop retaliation."
    example: "/es group stop red"
  - syntax: "/es group move <group>"
    description: "Walk into a formation around your current position. Requires an in-game director."
    example: "/es group move red"
  - syntax: "/es group lineup <group> [front|behind] [columns]"
    description: "Teleport every present, free member into block-aligned rows and columns beside you, each NPC on its own block. Unlike move, this does not walk them there."
    example: "/es group lineup red behind 5"
  - syntax: "/es group purge <group>"
    description: "Permanently delete every NPC in the group while keeping the group, its leader and its shared defaults. Operators only."
    example: "/es group purge red"
  - syntax: "/es group attack <group> <online-player>"
    description: "Add a nearby enemy player. Multiple targets divide the members into squads."
    example: "/es group attack red Alex"
  - syntax: "/es group attack <group> actor:<id>"
    description: "Add an enemy NPC. Its managed group becomes an enemy too."
    example: "/es group attack red actor:blue_1"
  - syntax: "/es group fight <group> <enemy-group>"
    description: "Engage another faction and its leader. An intelligent opposing group responds."
    example: "/es group fight red blue"
  - syntax: "/es actor set <id> aggressive on|off"
    description: "Toggle standalone retaliation. Uses real melee damage, misses, reaction delays, potions and shields."
    example: "/actor set guard aggressive on"
  - syntax: "/es scene"
    description: "List scene IDs."
    example: "/scene list"
  - syntax: "/es scene list"
    description: "List scene IDs."
    example: "/scene list"
  - syntax: "/es scene create <id>"
    description: "Create an empty scene."
    example: "/scene create opening"
  - syntax: "/es scene bind <id> <alias> <target>"
    description: "Give a target a short name inside this scene."
    example: "/scene bind opening guard actor:guard"
  - syntax: "/es scene add <id> <tick> <type> <target> [key=value;key=value]"
    description: "Add a timed action."
    example: "/scene add opening 20 swing guard"
  - syntax: "/es scene remove <id> <number>"
    description: "Delete one action by its displayed number, starting at 1."
    example: "/scene remove opening 2"
  - syntax: "/es scene append <destination> <source> <offset>"
    description: "Copy the source's actions into destination, adding offset ticks to each original time."
    example: "/scene append opening salute 100"
  - syntax: "/es scene repeat <id> <from> <through> <copies> <interval>"
    description: "Add more copies of an inclusive tick range. Interval must be longer than that range; 1–100 additional copies."
    example: "/scene repeat opening 0 40 3 60"
  - syntax: "/es scene restore <id> on|off"
    description: "Choose whether completion automatically restores the captured state."
    example: "/scene restore opening on"
  - syntax: "/es scene play <id>"
    description: "Start the scene."
    example: "/scene play opening"
  - syntax: "/es scene pause <id>"
    description: "Pause a running scene."
    example: "/scene pause opening"
  - syntax: "/es scene resume <id>"
    description: "Continue a paused scene."
    example: "/scene resume opening"
  - syntax: "/es scene stop <id>"
    description: "Stop and restore the captured state."
    example: "/scene stop opening"
  - syntax: "/es scene reset <id>"
    description: "Restore the retained snapshot of a completed take."
    example: "/scene reset opening"
  - syntax: "/es scene status <id>"
    description: "Show whether it is idle, running or paused."
    example: "/scene status opening"
  - syntax: "/es scene gui <id>"
    description: "Open its timeline editor."
    example: "/scene gui opening"
  - syntax: "/es scene delete <id>"
    description: "Stop and delete the saved scene."
    example: "/scene delete opening"
  - syntax: "/es record on"
    description: "Show the recording MOTD and block all non-operator logins, including reconnects. Players already online stay connected."
    example: "/es record on"
  - syntax: "/es record off"
    description: "End the session and return to normal MOTD/login rules. Repeating on/off reports the current state."
    example: "/es record off"
  - syntax: "/es camera move <x> <y> <z> <ticks> [yaw] [pitch]"
    description: "Temporarily use spectator mode and move your camera to coordinates in your current world; 1–72000 ticks. Omitted rotation keeps your initial view direction."
    example: "/es camera move 100 80 100 100 90 0"
  - syntax: "/es camera stop"
    description: "Stop the camera and restore your saved state."
    example: "/es camera stop"
  - syntax: "/es player health <points> [player]"
    description: "Set health, 0.01 to max health."
    example: "/es player health 6 Alex"
  - syntax: "/es player heal [on] [player]"
    description: "Fill health and extinguish fire."
    example: "/es player heal on Alex"
  - syntax: "/es player feed [on] [player]"
    description: "Fill hunger and saturation."
    example: "/es player feed"
  - syntax: "/es player hunger <0..20> [player]"
    description: "Set food level and clear saturation."
    example: "/es player hunger 10"
  - syntax: "/es player gamemode <survival|creative|adventure|spectator> [player]"
    description: "Change gamemode."
    example: "/es player gamemode survival Alex"
  - syntax: "/es player flight on|off [player]"
    description: "Allow/disallow flight."
    example: "/es player flight on"
  - syntax: "/es player invulnerable on|off [player]"
    description: "Toggle the real player's invulnerability."
    example: "/es player invulnerable on"
  - syntax: "/es player invisible on|off [player]"
    description: "Toggle entity invisibility; different from hiding the whole player with vanish."
    example: "/es player invisible on"
  - syntax: "/es player glow on|off [player]"
    description: "Toggle glowing outline."
    example: "/es player glow on Alex"
  - syntax: "/es player speed <0..1> [player]"
    description: "Set walking speed; ordinary default is 0.2."
    example: "/es player speed 0.2"
  - syntax: "/es player fire <0..12000> [player]"
    description: "Set fire ticks; 0 extinguishes."
    example: "/es player fire 0 Alex"
  - syntax: "/es player potion <preset> [player]"
    description: "Apply a preset from potions.yml. Shipped names: chase, underwater, dramatic."
    example: "/es player potion chase Alex"
  - syntax: "/es player clear-effects [on] [player]"
    description: "Remove current potion effects."
    example: "/es player clear-effects on Alex"
  - syntax: "/es player otp <name>"
    description: "Teleport you to the last logout position saved for that player; does not edit their offline inventory."
    example: "/es player otp Alex"
  - syntax: "/es player freeze on|off [player]"
    description: "Hold the player's position for the shot."
    example: ""
  - syntax: "/es player halfheart on|off [player]"
    description: "Prevent lethal damage without a held totem. Held totems pop normally, and half-heart protection stays enabled afterward. This is separate from NPC Immortal."
    example: ""
  - syntax: "/es player keepinv on|off [player]"
    description: "Keep inventory/experience through death."
    example: ""
  - syntax: "/es player no-hunger on|off [player]"
    description: "Stop hunger changes."
    example: ""
  - syntax: "/es player no-durability on|off [player]"
    description: "Stop item durability loss."
    example: ""
  - syntax: "/es player no-build on|off [player]"
    description: "Block that player's block placement."
    example: ""
  - syntax: "/es player no-break on|off [player]"
    description: "Block that player's block breaking."
    example: ""
  - syntax: "/es player no-pvp on|off [player]"
    description: "Prevent PvP involving that player."
    example: ""
  - syntax: "/es player lock-inventory on|off [player]"
    description: "Block inventory rearrangement."
    example: ""
  - syntax: "/es player lock-armor on|off [player]"
    description: "Block armor changes through supported inventory interactions."
    example: ""
  - syntax: "/es player lock-pickup on|off [player]"
    description: "Block item pickup."
    example: ""
  - syntax: "/es player vanish on|off [player]"
    description: "Hide from viewers without see.vanish; suppress their ordinary join/leave announcements while vanished."
    example: ""
  - syntax: "/es player pauseeffects on|off [player]"
    description: "Keep current potion effects active without their timers running down, then restore their saved remaining durations when switched OFF."
    example: ""
  - syntax: "/es take snapshot"
    description: "Save your location, inventory, health, hunger, XP, gamemode, effects and supported flags."
    example: "/es take snapshot"
  - syntax: "/es take reset"
    description: "Restore your saved take; you can repeat the reset."
    example: "/es take reset"
  - syntax: "/es take discard"
    description: "Forget the take snapshot without restoring it."
    example: "/es take discard"
  - syntax: "/es take start <id> [self|all]"
    description: "Start a production session with snapshots for yourself (default) or all online participants."
    example: "/es take start episode all"
  - syntax: "/es take stop [reset|keep]"
    description: "End the production session; default reset restores participants, keep leaves their current state."
    example: "/es take stop reset"
  - syntax: "/es kits claim <kit>"
    description: "Equip it on yourself, subject to that kit's access setting."
    example: "/es kits claim starter"
  - syntax: "/es kits claim <kit> <player>"
    description: "Equip it on an online real player. Giving to others requires op."
    example: "/es kits claim starter Alex"
  - syntax: "/es kits claim <player> <kit>"
    description: "Player-first alternative to the line above."
    example: "/es kits claim Alex starter"
  - syntax: "/es kits claim <kit> *"
    description: "Equip it on every online real player; NPCs are excluded. Op only."
    example: "/es kits claim starter *"
  - syntax: "/es kits claim * <kit>"
    description: "Recipient-first alternative for all online players."
    example: "/es kits claim * starter"
  - syntax: "/es kits claim <kit> actor:<id>"
    description: "Give the kit to an NPC/actor and save its equipment. Op only."
    example: "/es kits claim starter actor:guard"
  - syntax: "/es kits claim <kit> player:<name>"
    description: "Explicit player target; useful if their name is also a kit ID. UUIDs are accepted too."
    example: "/es kits claim starter player:Alex"
  - syntax: "/es kit"
    description: "List kit IDs visible to you."
    example: "/es kit list"
  - syntax: "/es kit list"
    description: "List kit IDs visible to you."
    example: "/es kit list"
  - syntax: "/es kit create <id>"
    description: "Create an empty kit; initially operators only."
    example: "/es kit create starter"
  - syntax: "/es kit save <id>"
    description: "Copy your current inventory into a new/existing kit. Existing access settings are retained."
    example: "/es kit save starter"
  - syntax: "/es kit edit <id>"
    description: "Open the copied-item editor. Save applies edits to the kit; leaving without Save discards the draft."
    example: "/es kit edit starter"
  - syntax: "/es kit apply <id>"
    description: "Older self-equip command; follows the same claim policy as kits claim."
    example: "/es kit apply starter"
  - syntax: "/es kit delete <id>"
    description: "Delete the saved kit."
    example: "/es kit delete starter"
  - syntax: "/es kits access <kit> operators"
    description: "Operators only."
    example: "/es kits access starter operators"
  - syntax: "/es kits access <kit> everyone"
    description: "Every player."
    example: "/es kits access starter everyone"
  - syntax: "/es kits access <kit> player <online-player>"
    description: "Exactly that player's UUID plus all operators."
    example: "/es kits access starter player Alex"
  - syntax: "/es kits imports"
    description: "Open the provider picker, then choose a kit or Import all kits."
    example: "/es kits imports"
  - syntax: "/es kits import <provider> <kit> [new-id]"
    description: "Import one kit's items. Omit new-id to generate an unused ID."
    example: "/es kits import PlayerKits2 starter imported_starter"
  - syntax: "/es kits importall <provider>"
    description: "Import every kit from one provider gradually, one per tick."
    example: "/es kits importall PlayerKits2"
  - syntax: "/es kits cancelimport"
    description: "Stop the active bulk import; keep kits already imported."
    example: "/es kits cancelimport"
  - syntax: "/es kits export <id>"
    description: "Write a portable YAML copy under plugins/EasyScripting/kit-exports/."
    example: "/es kits export starter"
  - syntax: "/es nickname <online-player-or-nickname>"
    description: "Give an online real player an unused public-provider nickname; preserve skin. Generated names are 5–16 characters and contain at least one digit or underscore. Excludes NPCs."
    example: "/nickname Alex"
  - syntax: "/es nickname <player-or-nickname> off"
    description: "Reset one player, accepting their account name or current nickname."
    example: "/nickname RiverScout off"
  - syntax: "/es nickname off"
    description: "Reset all temporary nicknames and cancel pending requests."
    example: "/nickname off"
  - syntax: "/es nick set <name>"
    description: "Set your own chosen temporary name."
    example: "/es nick set RiverScout"
  - syntax: "/es nick random [profile]"
    description: "Choose your own name from a configured local profile; default profile is default."
    example: "/es nick random default"
  - syntax: "/es nick reset"
    description: "Restore your original identity."
    example: "/es nick reset"
  - syntax: "/es nick info <name>"
    description: "Show recorded identity history associated with the name."
    example: "/es nick info Alex"
  - syntax: "/es nick blacklist add <name>"
    description: "Block the identity and purge matching existing NPCs/nicknames."
    example: "/es nick blacklist add ReservedName"
  - syntax: "/es nick blacklist remove <name>"
    description: "Allow the name again."
    example: "/es nick blacklist remove ReservedName"
  - syntax: "/es nick blacklist list"
    description: "List blocked names."
    example: "/es nick blacklist list"
  - syntax: "/es nick profile add <profile> <name>"
    description: "Add a name to a local random pool."
    example: "/es nick profile add extras RiverScout"
  - syntax: "/es nick profile remove <profile> <name>"
    description: "Remove a name from that pool."
    example: "/es nick profile remove extras RiverScout"
  - syntax: "/es skin <account-or-texture-url> [auto|slim|classic]"
    description: "Change your skin. Account lookup is asynchronous. auto preserves the account's model; raw texture URLs default to classic."
    example: "/es skin Notch auto"
  - syntax: "/es deadusers list"
    description: "Open the paginated Dead Users GUI. It shows saved heads, usernames, kind, owner and death time."
    example: "/deadusers list"
  - syntax: "/es deadusers search <username-or-part>"
    description: "Open the same GUI filtered by a case-insensitive full or partial username. Previous/Next keep the filter."
    example: "/deadusers search frost"
  - syntax: "/es deadusers remove <username>"
    description: "Release one retired name so it may be generated again."
    example: "/deadusers remove Frost_7"
  - syntax: "/es inventory view [player]"
    description: "Open a read-only inventory copy; reopen to refresh."
    example: "/es inventory view Alex"
  - syntax: "/es inventory ender [player]"
    description: "Open a read-only ender-chest copy."
    example: "/es inventory ender Alex"
  - syntax: "/es inventory save [player]"
    description: "Save an inventory rollback snapshot."
    example: "/es inventory save Alex"
  - syntax: "/es inventory history [player]"
    description: "List saved rollback IDs."
    example: "/es inventory history Alex"
  - syntax: "/es inventory restore <player> <snapshot-id>"
    description: "Replace that player's inventory with the selected snapshot; no world rollback."
    example: "/es inventory restore Alex <id-from-history>"
  - syntax: "/es inventory restock [player]"
    description: "Fill existing stacks to their maximum size."
    example: "/es inventory restock Alex"
  - syntax: "/es inventory fill"
    description: "Randomly fill empty slots of a container you are looking at within 6 blocks, using items.yml."
    example: "/es inventory fill"
  - syntax: "/es item name <text>"
    description: "Set a formatted item name."
    example: "/es item name <gold>Director's Key"
  - syntax: "/es item lore <line|line>"
    description: "Set description lines; the literal | separates lines."
    example: "/es item lore <gray>Scene prop|<yellow>Return after filming"
  - syntax: "/es item repair"
    description: "Remove all durability damage."
    example: "/es item repair"
  - syntax: "/es item durability <damage>"
    description: "Set damage used, from 0 to max durability. 0 means fully repaired."
    example: "/es item durability 10"
  - syntax: "/es item unbreakable on|off"
    description: "Toggle unbreakable item metadata."
    example: "/es item unbreakable on"
  - syntax: "/es item amount <number>"
    description: "Set current stack size, 1 to the item's max."
    example: "/es item amount 16"
  - syntax: "/es item enchant <enchantment> <level>"
    description: "Add an enchantment, 1–255; level 0 removes it."
    example: "/es item enchant sharpness 5"
  - syntax: "/es item attribute <attribute> <amount> [operation] [slot]"
