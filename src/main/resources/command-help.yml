  - syntax: "/es lock container off"
    description: "Unlock it."
    example: "/es lock container off"
  - syntax: "/es lock frame on"
    description: "Lock the targeted item frame."
    example: "/es lock frame on"
  - syntax: "/es lock frame off"
    description: "Unlock it."
    example: "/es lock frame off"
  - syntax: "/es effect lightning"
