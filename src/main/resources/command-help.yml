    description: "Gradually replace blocks with the saved region, including supported container/sign contents."
    example: "/es region restore stage"
  - syntax: "/es region cancel <id>"
    description: "Stop an active save/restore job; already restored blocks remain changed."
    example: "/es region cancel stage"
