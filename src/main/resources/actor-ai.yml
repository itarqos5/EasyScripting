# Movement and group-combat prototype. Distances are blocks; times are server ticks.
# Internal file-format version; keep the shipped value.
schema: 1
# Ambient walking and social wandering for NPCs outside a scene or replay.
movement:
  # Maximum distance in blocks for looking at a visible real player (1..32).
  look-radius: 12
  # Native navigation speed multiplier for wandering; 1.0 is normal walking (0.1..3).
  walk-speed: 1.0
  # Search this many blocks for nearby players/NPCs to stay near (4..64).
  social-radius: 24
  # Choose short wander destinations this many blocks around the social anchor (1..8).
  wander-radius: 4
  # With no nearby player, keep destinations within this distance of the wander starting point (2..32).
  home-radius: 12
  # Minimum delay between completed wander paths; 50 ticks is 2.5 seconds (10..400).
  wander-interval-ticks: 50
# Faction movement/combat limits. Actors keep independent health, equipment and supplies.
groups:
  # Enable group autonomous movement and target allocation; standalone aggression is independent.
  enabled: true
  # Maximum saved faction definitions (1..1000); actor count still uses config.yml limits.actors.
  max-groups: 100
  # Maximum remembered individual enemies per faction (1..256).
  max-targets: 128
  # Shared budget across all groups; requests are spread across server ticks.
  # Maximum new path requests shared by the NPC director each tick (1..32). Lower reduces bursts.
  paths-per-tick: 8
  # Minimum time before replacing an NPC path; moving targets must also have changed position (10..100).
  repath-ticks: 20
  # FOLLOW-only path refresh interval (1..20). Five ticks keeps up with a walking player without pathing every tick.
  follow-repath-ticks: 5
  # Repath after the moving formation slot shifts this many blocks (0.1..4).
  follow-goal-change: 0.5
  # Stop pathing once an NPC is this close to its assigned trailing slot (0.5..3). Smaller values
  # make the rows and columns line up visibly; larger ones settle sooner but look ragged.
  follow-arrival-distance: 0.6
  # Extra distance beyond follow-arrival-distance before a member that already took its place
  # walks again (0.1..4), capped at follow-catch-up-distance. This gap stops a settled formation
  # from stuttering between walking and standing while the leader shuffles on the spot.
  follow-resume-margin: 1.0
  # Distance in blocks between trailing rows and columns (1.5..5); larger groups use more rows.
  follow-spacing: 2.5
  # Members per row behind the leader (0..32). 0 picks the squarest block that fits the group:
  # 9 members form 3x3, 100 form 10x10. Set 5 for a narrow file, 20 for a wide battle line.
  follow-columns: 0
  # Normal player-like walking speed multiplier while following or moving to a formation (0.1..3).
  follow-speed: 1.0
  # Beyond this distance from its slot, a follower uses the catch-up pace (3..48).
  follow-catch-up-distance: 8.0
  # Sprint-like path speed used only while catching up; must be at least follow-speed (0.1..3).
  follow-catch-up-speed: 1.3
  # Very distant followers walk through intermediate path targets this far apart; they do not teleport (8..80).
  follow-waypoint-distance: 32.0
  # Native speed multiplier while pursuing an enemy (0.1..3).
  chase-speed: 1.35
  # Sprint while closing on an enemy further away than this many blocks (2..32). Closer than
  # this an NPC walks, the way a player stops sprinting before a hit to keep their knockback.
  sprint-chase-distance: 5.0
  # Stop steering an NPC that is falling further than this many blocks above the ground (0..8).
  # Navigation requests during a long drop fight gravity and make the descent look floaty, so
  # the NPC is left to fall normally and takes its ordinary fall damage. 0 disables the pause.
  fall-pause-distance: 1.5
  # Maximum distance in blocks between an NPC and an eligible enemy; targets outside it are dropped (8..96).
  engagement-radius: 48
  # Maximum melee distance in blocks (1..3). Attacks also require line of sight.
  melee-reach: 3.0
  # Shortest interval between melee attempts (10..100), plus the random combat jitter below.
  # With combat.weapon-cooldown on, the held weapon's own recharge decides the real pace and this
  # is only a floor; raise it to deliberately slow NPCs below what their weapon allows.
  attack-cooldown-ticks: 10
  # Wait this long after taking damage before resuming navigation (1..60), allowing real knockback.
  knockback-pause-ticks: 12
# Carried-item reactions. Totem refill works on idle NPCs; combat reactions require Intelligence/aggression.
combat:
  # Automatically move a carried totem into the offhand, preserving the displaced item.
  auto-totem: true
  # 1 tick = about 50 ms at 20 TPS; Minecraft cannot safely switch inventory in 20 ms.
  # Delay after a totem pop before offhand refill (1..20); 1 is about 50 ms at 20 TPS.
  totem-refill-ticks: 1
  # Chance a melee attempt connects (0..1); 0.82 means an 82% attempt success rate before vanilla checks.
  accuracy: 0.82
  # Shortest random potion/jump/shield reaction delay (1..40); never instant.
  reaction-min-ticks: 3
  # Longest random reaction delay, at least reaction-min-ticks and at most 60.
  reaction-max-ticks: 9
  # Add a random 0..this many ticks to each melee cooldown (0..20).
  attack-jitter-ticks: 4
  # Wait for the held weapon to finish recharging before swinging, the way a player does.
  # Off means NPCs attack on the cooldown above alone and land weak, partly charged hits.
  weapon-cooldown: true
  # Chance to hop before a ready melee attempt so the blow lands as a vanilla critical (0..1).
  crit-jump-chance: 0.3
  # Ticks between that hop and the strike (4..12); the NPC must still be falling when it lands.
  crit-jump-delay-ticks: 8
  # Chance to schedule a jump after an incoming hit (0..1); requires the NPC to be on the ground.
  jump-reset-chance: 0.18
  # Allow intelligent NPCs to consume and throw beneficial splash potions from their own backpack.
  potions: true
  # Maximum number of potions thrown per defensive burst (1..3), limited by actual inventory.
  potion-count: 3
  # Delay between the individual upward throws (2..40). Each throw consumes one potion.
  potion-interval-ticks: 8
  # Minimum time between starting defensive potion bursts (20..2400).
  potion-cooldown-ticks: 200
  # Chance to react to a mace holder (0..1); requires a carried shield.
  shield-chance: 0.55
  # Minimum interval between shield reaction rolls (10..100), so repeated checks are not instant guarantees.
  shield-check-ticks: 30
  # Duration of a successful shield hold (5..60); afterward automatic totem handling resumes.
  shield-hold-ticks: 16
  # Also raise the shield against a mace holder standing at the NPC's own level within this many
  # blocks (0..16). 0 keeps the old behavior of only reacting to a mace directly overhead.
  shield-ground-radius: 5.0
  # Keep blocking past shield-hold-ticks while the mace holder is still a threat, up to this long
  # (20..200). The shield then drops so the NPC can fight back instead of blocking forever.
  shield-max-hold-ticks: 60
  # Treat a mace carried anywhere in a player's inventory as a threat, not only one in their hand.
  # Players swap a mace in for the hit itself, so reacting only to a held mace reacts too late.
  # Off returns to held-mace-only detection.
  shield-inventory-mace: true
# Self preservation. Each reaction needs the NPC to actually carry the item; nothing is created.
survival:
  # Break off and eat a carried golden apple at or below this fraction of maximum health (0..1).
  # 0 disables healing. The NPC backs away first, then eats; the meal can be interrupted.
  heal-health: 0.45
  # Minimum time between healing attempts (40..2400), whether or not the last one succeeded.
  heal-cooldown-ticks: 200
  # Throw a carried ender pearl away from the fight at or below this fraction of maximum health
  # (0..1); 0 disables escaping. Must not be above heal-health: an NPC gaps before it runs.
  # A landing pearl hurts its thrower for 5 health, so an NPC that would die to its own pearl
  # keeps fighting instead. Vanilla teleports PLAYER actors only; a mob actor throws and stays.
  escape-health: 0.35
  # Minimum time between escape attempts (40..2400).
  escape-cooldown-ticks: 400
  # How far an NPC tries to get from its enemy while healing or escaping (3..24).
  retreat-distance: 8.0
  # Keep backing off for this long after the reason has passed (10..200), so it is a real gap
  # rather than a flinch. A new order, a finished meal or a lost enemy still ends it early.
  retreat-ticks: 60
  # Chance to sidestep around the target between swings instead of standing still (0..1).
  strafe-chance: 0.35
  # Minimum time between sidesteps (5..60); each one is a short path, not a shove.
  strafe-interval-ticks: 14
