      slot: 14
      material: "LIME_DYE"
      lore: ["<gray>Choose an existing actor to add.", "<gray>For a whole tag: /es group add {group} tag:name"]
    group-remove:
      slot: 16
      material: "SHEARS"
      lore: ["<gray>Remove membership; keep the NPC alive."]
    group-follow:
      slot: 20
      material: "LEATHER_BOOTS"
      lore: ["<gray>Walk in stable rows behind the leader.", "<gray>Uses normal pace, then sprints to catch up.", "<gray>With intelligence ON, attack the leader's targets."]
