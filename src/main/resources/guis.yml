      slot: 22
      material: "SHIELD"
      lore: ["<gray>Stop movement and clear current attack orders.", "<gray>Intelligence ON still allows self-defense."]
    group-move:
      slot: 24
      material: "COMPASS"
      lore: ["<gray>Walk to a formation around where you stand.", "<gray>Uses paths; never teleports through obstacles."]
