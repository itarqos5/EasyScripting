      slot: 33
      material: "COMPARATOR"
      lore: ["<gray>ON: obey attacks, divide targets and defend allies.", "<gray>OFF: follow/move orders only.", "<gray>NPCs cannot hurt allies/leaders; leaders can hit their NPCs."]
