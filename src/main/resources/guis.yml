# EasyScripting studio menus · schema 2
# Slots are zero-based. The 21 content slots sit above workflow controls.
# Footer: previous 45, create/save 47, back 48, home 49, close 50, help 51, next 53.
# Older layouts are backed up automatically before this design is installed.
schema: 2
layout:
  rows: 6
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  filler: "BLACK_STAINED_GLASS_PANE"
  filler-name: " "
  header-slot: 4
  help-slot: 51
  empty-slot: 22
  previous-slot: 45
  back-slot: 48
  home-slot: 49
  close-slot: 50
  next-slot: 53
  previous-name: "<aqua>← Previous page"
  back-name: "<white>← Back"
  home-name: "<aqua>Studio home"
  close-name: "<gray>Close menu"
  help-name: "<yellow>How to use this page"
  next-name: "<aqua>Next page →"
  entry-name: "<white>{name}"
  click-lore: ["<yellow>Click to select"]
  select-lore: ["<gray>Choose this saved item.","","<yellow>Click to select"]
  empty-lore: ["<gray>Your saved items will appear here.","","<yellow>Use the green create button below."]
  picker-empty-name: "<white>No saved items available"
  picker-empty-lore: ["<gray>Create an item in its library first.","<gray>Then return here to choose it."]
  locked-name: "<red>You do not have access to this control."
  enabled: "<green>ON"
  disabled: "<gray>OFF"
menus:
  main:
    title: "<dark_gray>EasyScripting · Studio"
    heading: "<white><bold>EasyScripting · Studio"
    material: "NETHER_STAR"
    description: ["<gray>Start with Actors to create your cast.","<gray>Record a performance, then build a scene.","<gray>Hover over any control for instructions."]
    buttons:
      actors:
        slot: 11
        material: "PLAYER_HEAD"
        name: "<white>Actors"
        lore: ["<gray>Create, dress and direct your NPCs.","","<yellow>Click to select"]
        action: "menu actors"
        permission: "actor"
      recording:
        slot: 13
        material: "CLOCK"
        name: "<white>Recordings"
        lore: ["<gray>Saved performances and movement takes.","","<yellow>Click to select"]
        action: "menu recording"
        permission: "record"
      scenes:
        slot: 15
        material: "WRITABLE_BOOK"
        name: "<white>Scenes"
        lore: ["<gray>Arrange actions into a timed scene.","","<yellow>Click to select"]
        action: "menu scenes"
        permission: "scene.play"
      players:
        slot: 29
        material: "TOTEM_OF_UNDYING"
        name: "<white>My player"
        lore: ["<gray>Health, movement and take snapshots.","","<yellow>Click to select"]
        action: "menu players"
        permission: "player"
      wardrobe:
        slot: 31
        material: "CHEST"
        name: "<white>Wardrobe"
        lore: ["<gray>Saved costumes and held-item editing.","","<yellow>Click to select"]
        action: "menu wardrobe"
        permission: "use"
      stage:
        slot: 33
        material: "COMPASS"
        name: "<white>Stage tools"
        lore: ["<gray>World settings and production effects.","","<yellow>Click to select"]
        action: "menu stage"
        permission: "use"
      production:
        slot: 37
        material: "REDSTONE_TORCH"
        name: "<white>Production"
        lore: ["<gray>Sessions, chat, voice and server access.","","<yellow>Click to select"]
        action: "menu production"
        permission: "use"
      organization:
        slot: 39
        material: "WHITE_BANNER"
        name: "<white>Organization"
        lore: ["<gray>Teams, warps and villager templates.","","<yellow>Click to select"]
        action: "menu organization"
        permission: "use"
      settings:
        slot: 41
        material: "COMPARATOR"
        name: "<white>Settings"
        lore: ["<gray>Feature switches and access rules.","","<yellow>Click to select"]
        action: "menu settings"
        permission: "admin"
  wardrobe:
    title: "<dark_gray>Wardrobe"
    heading: "<white><bold>Wardrobe"
    material: "CHEST"
    description: ["<gray>Save costumes and edit your held item."]
    buttons:
      kits:
        slot: 20
        material: "CHEST"
        name: "<white>Costumes & kits"
        lore: ["<gray>Save, apply and edit inventory loadouts.","","<yellow>Click to select"]
        action: "menu kits"
        permission: "kit"
      item:
        slot: 24
        material: "ANVIL"
        name: "<white>Held item editor"
        lore: ["<gray>Name, lore, durability and enchantments.","","<yellow>Click to select"]
        action: "menu item"
        permission: "items"
  stage:
    title: "<dark_gray>Stage tools"
    heading: "<white><bold>Stage tools"
    material: "COMPASS"
    description: ["<gray>Set the world and add effects to your shot."]
    buttons:
      world:
        slot: 20
        material: "COMPASS"
        name: "<white>World controls"
        lore: ["<gray>Prepare time, weather and your set.","","<yellow>Click to select"]
        action: "menu world"
        permission: "world"
      effects:
        slot: 24
        material: "FIREWORK_ROCKET"
        name: "<white>Effects"
        lore: ["<gray>Visual cues, combat props and cleanup.","","<yellow>Click to select"]
        action: "menu effects"
        permission: "effects"
  organization:
    title: "<dark_gray>Organization"
    heading: "<white><bold>Organization"
    material: "WHITE_BANNER"
    description: ["<gray>Manage teams, locations and trading actors."]
    buttons:
      teams:
        slot: 20
        material: "WHITE_BANNER"
        name: "<white>Teams"
        lore: ["<gray>Colors, glow and name visibility.","","<yellow>Click to select"]
        action: "menu teams"
        permission: "team"
      warps:
        slot: 22
        material: "ENDER_PEARL"
        name: "<white>Saved locations"
        lore: ["<gray>Save and revisit points on your set.","","<yellow>Click to select"]
        action: "menu warps"
        permission: "warp"
      villagers:
        slot: 24
        material: "EMERALD"
        name: "<white>Villager templates"
        lore: ["<gray>Reusable trading actors.","","<yellow>Click to select"]
        action: "menu villagers"
        permission: "villager"
  settings:
    title: "<dark_gray>Studio settings"
    heading: "<white><bold>Studio settings"
    material: "COMPARATOR"
    description: ["<gray>Control feature availability and access."]
    buttons:
      features:
        slot: 20
        material: "LEVER"
        name: "<white>Feature switches"
        lore: ["<gray>Enable only the features you need.","","<yellow>Click to select"]
        action: "menu features"
        permission: "admin"
      permissions:
        slot: 24
        material: "TRIPWIRE_HOOK"
        name: "<white>Access rules"
        lore: ["<gray>Choose who can use each feature.","","<yellow>Click to select"]
        action: "menu permissions"
        permission: "admin"
  item:
    title: "<dark_gray>Held item editor"
    heading: "<white><bold>Held item editor"
    material: "ANVIL"
    description: ["<gray>Hold the item you want to edit.","<gray>Changes apply directly to your main hand."]
    buttons:
      name:
        slot: 11
        material: "NAME_TAG"
        name: "<white>Rename item"
        lore: ["<gray>Set the name of the held item.","","<yellow>Click to select"]
        action: "input item name"
        permission: "items"
        prompt: "Enter the item name (MiniMessage supported)."
      lore:
        slot: 13
        material: "PAPER"
        name: "<white>Edit description"
        lore: ["<gray>Add the lines below the item name.","","<yellow>Click to select"]
        action: "input item lore"
        permission: "items"
        prompt: "Enter lore, using | between lines."
      enchant:
        slot: 15
        material: "ENCHANTED_BOOK"
        name: "<white>Enchant item"
        lore: ["<gray>Choose an enchantment and level.","","<yellow>Click to select"]
        action: "input item enchant"
        permission: "items"
        prompt: "Enter enchantment and level, e.g. sharpness 5."
      repair:
        slot: 29
        material: "ANVIL"
        name: "<white>Repair item"
        lore: ["<gray>Restore durability to full.","","<yellow>Click to select"]
        action: "command item repair"
        permission: "items"
      unbreakable:
        slot: 31
        material: "BEDROCK"
        name: "<white>Disable durability loss"
        lore: ["<gray>Make the held item unbreakable.","","<yellow>Click to select"]
        action: "command item unbreakable on"
        permission: "items"
      breakable:
        slot: 33
        material: "IRON_PICKAXE"
        name: "<white>Enable durability loss"
        lore: ["<gray>Allow the held item to wear down.","","<yellow>Click to select"]
        action: "command item unbreakable off"
        permission: "items"
      attribute:
        slot: 40
        material: "DIAMOND_SWORD"
        name: "<white>Edit attribute"
        lore: ["<gray>Modify a combat or equipment attribute.","","<yellow>Click to select"]
        action: "input item attribute"
        permission: "items"
        prompt: "Enter attribute amount [operation] [slot], e.g. attack_damage 4 ADD_NUMBER mainhand."
    parent: "wardrobe"
  production:
    title: "<dark_gray>Production controls"
    heading: "<white><bold>Production controls"
    material: "REDSTONE_TORCH"
    description: ["<gray>Manage a coordinated recording session.","<gray>These controls can affect other players."]
    buttons:
      start:
        slot: 11
        material: "REDSTONE_BLOCK"
        name: "<white>Start session"
        lore: ["<gray>Begin a coordinated production take.","","<yellow>Click to select"]
        action: "input take start"
        permission: "record"
        prompt: "Enter a session identifier and optional self or all."
      stop:
        slot: 15
        material: "RECOVERY_COMPASS"
        name: "<white>Stop session & reset"
        lore: ["<gray>End the session and restore its players.","","<yellow>Click to select"]
        action: "command take stop reset"
        permission: "record"
      mute:
        slot: 20
        material: "RED_DYE"
        name: "<white>Mute public chat"
        lore: ["<gray>Pause public chat for the shoot.","","<yellow>Click to select"]
        action: "command chat mute on"
        permission: "chat"
      unmute:
        slot: 24
        material: "LIME_DYE"
        name: "<white>Open public chat"
        lore: ["<gray>Allow public chat again.","","<yellow>Click to select"]
        action: "command chat mute off"
        permission: "chat"
      lock:
        slot: 29
        material: "IRON_DOOR"
        name: "<white>Lock server joins"
        lore: ["<gray>Prevent new joins during production.","","<yellow>Click to select"]
        action: "command server lock on"
        permission: "admin"
      unlock:
        slot: 33
        material: "OAK_DOOR"
        name: "<white>Open server joins"
        lore: ["<gray>Allow players to join again.","","<yellow>Click to select"]
        action: "command server lock off"
        permission: "admin"
      voice:
        slot: 38
        material: "NOTE_BLOCK"
        name: "<white>Mute my voice"
        lore: ["<gray>Requires Simple Voice Chat.","","<yellow>Click to select"]
        action: "command voice mute on"
        permission: "voice"
      unvoice:
        slot: 42
        material: "JUKEBOX"
        name: "<white>Unmute my voice"
        lore: ["<gray>Requires Simple Voice Chat.","","<yellow>Click to select"]
        action: "command voice mute off"
        permission: "voice"
  world:
    title: "<dark_gray>World controls"
    heading: "<white><bold>World controls"
    material: "COMPASS"
    description: ["<gray>Time and weather affect your current world.","<gray>The preview border is visible only to you."]
    buttons:
      day:
        slot: 11
        material: "SUNFLOWER"
        name: "<white>Set noon"
        lore: ["<gray>Set world time to 6000 ticks.","","<yellow>Click to select"]
        action: "command world time 6000"
        permission: "world"
      night:
        slot: 15
        material: "CLOCK"
        name: "<white>Set midnight"
        lore: ["<gray>Set world time to 18000 ticks.","","<yellow>Click to select"]
        action: "command world time 18000"
        permission: "world"
      clear:
        slot: 20
        material: "GLASS"
        name: "<white>Clear skies"
        lore: ["<gray>Stop rain and thunderstorms.","","<yellow>Click to select"]
        action: "command world weather clear"
        permission: "world"
      rain:
        slot: 22
        material: "WATER_BUCKET"
        name: "<white>Start rain"
        lore: ["<gray>Set rainy weather.","","<yellow>Click to select"]
        action: "command world weather rain"
        permission: "world"
      thunder:
        slot: 24
        material: "LIGHTNING_ROD"
        name: "<white>Start thunderstorm"
        lore: ["<gray>Set stormy weather.","","<yellow>Click to select"]
        action: "command world weather thunder"
        permission: "world"
      top:
        slot: 29
        material: "LADDER"
        name: "<white>Go to the surface"
        lore: ["<gray>Teleport yourself to the highest block.","","<yellow>Click to select"]
        action: "command world top"
        permission: "world"
      wand:
        slot: 33
        material: "WOODEN_AXE"
        name: "<white>Get region wand"
        lore: ["<gray>Select corners of a set for snapshots.","","<yellow>Click to select"]
        action: "command region wand"
        permission: "world.edit"
      border:
        slot: 38
        material: "BLUE_STAINED_GLASS"
        name: "<white>Preview border"
        lore: ["<gray>Show a border only to your player.","","<yellow>Click to select"]
        action: "input world border"
        permission: "world"
        prompt: "Enter the border size in blocks."
      clear-border:
        slot: 42
        material: "GLASS_PANE"
        name: "<white>Clear border preview"
        lore: ["<gray>Restore your normal world border view.","","<yellow>Click to select"]
        action: "command world border reset"
        permission: "world"
    parent: "stage"
  effects:
    title: "<dark_gray>Effects"
    heading: "<white><bold>Effects"
    material: "FIREWORK_ROCKET"
    description: ["<gray>Trigger effects at your current position.","<gray>Arrow and railgun effects can deal damage."]
    buttons:
      lightning:
        slot: 11
        material: "LIGHTNING_ROD"
        name: "<white>Lightning flash"
        lore: ["<gray>Visual lightning at your position.","","<yellow>Click to select"]
        action: "command effect lightning"
        permission: "effects"
      explosion:
        slot: 13
        material: "TNT"
        name: "<white>Explosion effect"
        lore: ["<gray>Visual explosion without block damage.","","<yellow>Click to select"]
        action: "command effect explosion"
        permission: "effects"
      orbital:
        slot: 15
        material: "FIREWORK_ROCKET"
        name: "<white>Orbital effect"
        lore: ["<gray>Trigger an orbital visual sequence.","","<yellow>Click to select"]
        action: "command effect orbital"
        permission: "effects"
      cannon:
        slot: 29
        material: "ARROW"
        name: "<white>Arrow cannon"
        lore: ["<gray>Launch 8 arrows; these can damage entities.","","<yellow>Click to select"]
        action: "command effect arrows 8"
        permission: "effects"
      railgun:
        slot: 31
        material: "CROSSBOW"
        name: "<white>Railgun"
        lore: ["<gray>Fire a damaging shot along your aim.","","<yellow>Click to select"]
        action: "command effect railgun"
        permission: "effects"
      totem:
        slot: 33
        material: "TOTEM_OF_UNDYING"
        name: "<white>Totem animation"
        lore: ["<gray>Play the totem animation for yourself.","","<yellow>Click to select"]
        action: "command effect totem"
        permission: "effects"
      cleanup:
        slot: 40
        material: "BARRIER"
        name: "<white>Stop owned effects"
        lore: ["<gray>Remove effects created by this plugin.","","<yellow>Click to select"]
        action: "command effect stop"
        permission: "effects"
    parent: "stage"
  actors:
    title: "<dark_gray>Actors · {page}"
    heading: "<white><bold>Actors · {page}"
    material: "PLAYER_HEAD"
    description: ["<gray>Choose an NPC to open its control panel.","<gray>Use the green button below to create one.","<gray>Shift-right click an entry to delete it."]
  recording:
    title: "<dark_gray>Recordings · {page}"
    heading: "<white><bold>Recordings · {page}"
    material: "CLOCK"
    description: ["<gray>Choose a saved take, then select an NPC.","<gray>Use the green button below to create one.","<gray>Shift-right click an entry to delete it."]
  scenes:
    title: "<dark_gray>Scenes · {page}"
    heading: "<white><bold>Scenes · {page}"
    material: "WRITABLE_BOOK"
    description: ["<gray>Choose a scene to view its timeline.","<gray>Use the green button below to create one.","<gray>Shift-right click an entry to delete it."]
  kits:
    title: "<dark_gray>Costumes & kits · {page}"
    heading: "<white><bold>Costumes & kits · {page}"
    material: "CHEST"
    description: ["<gray>Click to apply; right click to edit a copy.","<gray>Use the green button below to create one.","<gray>Shift-right click an entry to delete it."]
    parent: "wardrobe"
  warps:
    title: "<dark_gray>Saved locations · {page}"
    heading: "<white><bold>Saved locations · {page}"
    material: "ENDER_PEARL"
    description: ["<gray>Choose a location to teleport there.","<gray>Use the green button below to create one.","<gray>Shift-right click an entry to delete it."]
    parent: "organization"
  teams:
    title: "<dark_gray>Teams · {page}"
    heading: "<white><bold>Teams · {page}"
    material: "WHITE_BANNER"
    description: ["<gray>Choose a team to change its settings.","<gray>Use the green button below to create one.","<gray>Shift-right click an entry to delete it."]
    parent: "organization"
  villagers:
    title: "<dark_gray>Villager templates · {page}"
    heading: "<white><bold>Villager templates · {page}"
    material: "EMERALD"
    description: ["<gray>Choose a template to spawn it beside you.","<gray>Use the green button below to create one.","<gray>Shift-right click an entry to delete it."]
    parent: "organization"
  players:
    title: "<dark_gray>My player controls"
    heading: "<white><bold>My player controls"
    material: "TOTEM_OF_UNDYING"
    description: ["<gray>Each switch affects your own player.","<gray>ON applies the effect; click to toggle.","<gray>Snapshot and reset controls are below."]
  features:
    title: "<dark_gray>Feature switches · {page}"
    heading: "<white><bold>Feature switches · {page}"
    material: "LEVER"
    description: ["<gray>ON makes a feature available.","<gray>Permissions still control who can use it.","<gray>Click a switch to change its state."]
    parent: "settings"
  permissions:
    title: "<dark_gray>Access rules · {page}"
    heading: "<white><bold>Access rules · {page}"
    material: "TRIPWIRE_HOOK"
    description: ["<gray>Hover to read the current permission rule.","<gray>Click to enter a custom node or everyone."]
    parent: "settings"
  timeline:
    title: "<dark_gray>{name} · Timeline · {page}"
    heading: "<white><bold>{name} · Timeline · {page}"
    material: "WRITABLE_BOOK"
    description: ["<gray>Actions run in tick order (20 ticks = 1 second).","<gray>Use the controls below to play or edit.","<gray>Shift-right click an action to delete it."]
  confirm:
    title: "<dark_gray>Delete {name}?"
    heading: "<white><bold>Delete {name}?"
    material: "BARRIER"
    description: ["<gray>This permanently removes the selected item.","<gray>Choose Keep it to return without deleting."]
  picker:
    title: "<dark_gray>{name} · {page}"
    heading: "<white><bold>{name} · {page}"
    material: "CHEST"
    description: ["<gray>Click an entry to select it.","<gray>Back returns without making a change."]
  inventory:
    title: "<dark_gray>{name} · Inventory preview"
    heading: "<white><bold>{name} · Inventory preview"
    material: "CHEST"
    description: ["<gray>This is a read-only view of the inventory.","<gray>Items cannot be taken from this page."]
  kit-editor:
    title: "<dark_gray>{name} · Edit costume"
    heading: "<white><bold>{name} · Edit costume"
    material: "CHEST"
    description: ["<gray>Click your inventory to copy an item.","<gray>Click a kit slot to place; right click clears.","<gray>Slots 0–8: hotbar · 9–35: storage","<gray>36–39: boots, legs, chest, helmet","<gray>40: offhand · Save commits your edits."]
  actor:
    title: "<dark_gray>{name} · NPC overview"
    heading: "<white><bold>{name} · NPC overview"
    material: "PLAYER_HEAD"
    description: ["<gray>Use the tabs above to switch sections.","<gray>ID: {id} · Status: {status}"]
  actor-appearance:
    title: "<dark_gray>{name} · Appearance"
    heading: "<white><bold>{name} · Appearance"
    material: "NAME_TAG"
    description: ["<gray>Edit the displayed name, skin and costume.","<gray>The NPC identifier stays the same."]
  actor-movement:
    title: "<dark_gray>{name} · Movement"
    heading: "<white><bold>{name} · Movement"
    material: "COMPASS"
    description: ["<gray>Position your NPC and control its behavior.","<gray>Stop playback before changing movement."]
  actor-acting:
    title: "<dark_gray>{name} · Acting & Playback"
    heading: "<white><bold>{name} · Acting & Playback"
    material: "ARMOR_STAND"
    description: ["<gray>1. Act as NPC, then move and perform.","<gray>2. Finish & save to return to yourself.","<gray>3. Autoplay starts the saved performance.","<gray>Choose what happens at the end below."]
  actor-combat:
    title: "<dark_gray>{name} · Combat"
    heading: "<white><bold>{name} · Combat"
    material: "IRON_SWORD"
    description: ["<gray>Hittable ON: receive damage and knockback.","<gray>Immortal ON: prevent lethal damage.","<gray>To allow death, turn Immortal OFF."]
entries:
  actors:
    create: "<green>Create NPC"
    empty: "<white>Your cast starts here"
    lore: ["<gray>ID: <white>{id}","<gray>{detail}","","<yellow>Click to manage this NPC","<red>Shift-right click to delete"]
  recording:
    create: "<green>Record my movement"
    empty: "<white>No performances recorded yet"
    lore: ["<gray>ID: <white>{id}","<gray>{detail}","","<yellow>Click to assign to an NPC","<red>Shift-right click to delete"]
  scenes:
    create: "<green>Create scene"
    empty: "<white>Your first scene starts here"
    lore: ["<gray>ID: <white>{id}","<gray>{detail}","","<yellow>Click to open the timeline","<red>Shift-right click to delete"]
  kits:
    create: "<green>Save my inventory as a kit"
    empty: "<white>No costumes saved yet"
    lore: ["<gray>ID: <white>{id}","<gray>{detail}","","<yellow>Click to apply · Right click to edit","<red>Shift-right click to delete"]
  warps:
    create: "<green>Save my current location"
    empty: "<white>No locations saved yet"
    lore: ["<gray>ID: <white>{id}","<gray>{detail}","","<yellow>Click to teleport","<red>Shift-right click to delete"]
  teams:
    create: "<green>Create team"
    empty: "<white>No teams created yet"
    lore: ["<gray>ID: <white>{id}","<gray>{detail}","","<yellow>Click to change team settings","<red>Shift-right click to delete"]
  villagers:
    create: "<green>Create template"
    empty: "<white>No villager templates saved"
    lore: ["<gray>ID: <white>{id}","<gray>{detail}","","<yellow>Click to spawn this template","<red>Shift-right click to delete"]
dynamic:
  controls:
    actor-tab-overview:
      slot: 0
      material: "BOOK"
      lore: ["<gray>Open overview controls."]
    actor-tab-appearance:
      slot: 1
      material: "NAME_TAG"
      lore: ["<gray>Open appearance controls."]
    actor-tab-movement:
      slot: 2
      material: "COMPASS"
      lore: ["<gray>Open movement controls."]
    actor-tab-acting:
      slot: 6
      material: "ARMOR_STAND"
      lore: ["<gray>Open acting controls."]
    actor-tab-combat:
      slot: 7
      material: "IRON_SWORD"
      lore: ["<gray>Open combat controls."]
    actor-section-appearance:
      slot: 11
      material: "PLAYER_HEAD"
      lore: ["<gray>Name, skin, costume and visual details.","<gray>Click to open this section."]
    actor-section-acting:
      slot: 13
      material: "ARMOR_STAND"
      lore: ["<gray>Perform as this NPC and replay the take.","<gray>Click to open this section."]
    actor-section-combat:
      slot: 15
      material: "IRON_SWORD"
      lore: ["<gray>Damage, knockback, immortality and death.","<gray>Click to open this section."]
    actor-section-movement:
      slot: 31
      material: "COMPASS"
      lore: ["<gray>Position, visibility and idle behavior.","<gray>Click to open this section."]
    actor-info:
      slot: 22
      material: "BOOK"
      lore: ["<gray>ID: {id}","<gray>Status: {status}","<gray>Skin: {skin}","<gray>Recording: {recording}","<gray>Autoplay: {autoplay} · End: {mode}"]
    actor-delete:
      slot: 43
      material: "BARRIER"
      lore: ["<gray>Remove this actor permanently.","<gray>You will be asked to confirm."]
    actor-name:
      slot: 11
      material: "NAME_TAG"
      lore: ["<gray>Current: {name}","<gray>Enter the new name in chat."]
    actor-skin:
      slot: 13
