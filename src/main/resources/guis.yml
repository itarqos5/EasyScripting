# All titles, names, lore and labels use MiniMessage colors; quoted empty strings hide text.
# layout: rows must be 6; *-slot values are zero-based inventory indices (0..53).
# content-slots are paged entry positions; empty-slot is where an empty-library message appears.
# filler and *.material are Bukkit item material names; filler-name is the border item label.
# *-name and dynamic labels are visible button text. *-lore, lore and description are hover-text lines.
# menus.<id>: title is the window title; heading/material/description define the top information card; parent is the Back destination.
# menus.<id>.buttons.<id>: slot/material/name/lore define the control; permission is an easyscripting.* suffix.
# action starts with menu (open page), command (execute /es suffix), or input (ask for text); prompt explains expected input.
# dynamic.controls.<id>: slot/material/lore customize a code-backed control; its label is dynamic.<id>.
# entries.<library>: create/empty/name/lore configure library states and entries. player-flags configure each player toggle.
# features and actor flag sections label their corresponding switches; true/false state labels come from layout.enabled/disabled.
# Tokens such as {name}, {id}, {state}, {group}, {leader}, {members}, {order}, {intelligence}, {session}, {health}, {status}, {recording}, {mode}, {autoplay}, {access}, {page}, {detail} are filled by the relevant page.
# Current selections glow. Changing a slot must not overlap another control or the navigation/footer.
# Schema 3 installs the simplified menu layout once and backs up older guis.yml files before replacement.

# EasyScripting studio menus · schema 3
# Slots are zero-based. The 21 content slots sit above workflow controls.
# Footer: previous 45, create/save 47, back 48, home 49, close 50, help 51, next 53.
# Older layouts are backed up automatically before this design is installed.
# Internal file-format version; keep the shipped value.
schema: 3
layout:
  rows: 6
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  filler: "BLACK_STAINED_GLASS_PANE"
  filler-name: " "
  header-slot: 4
  help-slot: 51
  empty-slot: 22
  previous-slot: 45
  back-slot: 48
  home-slot: 49
  close-slot: 50
  next-slot: 53
  previous-name: "<aqua>← Previous page"
  back-name: "<white>← Back"
  home-name: "<aqua>Studio home"
  close-name: "<gray>Close menu"
  help-name: "<yellow>How to use this page"
  next-name: "<aqua>Next page →"
  entry-name: "<white>{name}"
  click-lore: ["<yellow>Click to select"]
  select-lore: ["<gray>Choose this saved item.","","<yellow>Click to select"]
  empty-lore: ["<gray>Your saved items will appear here.","","<yellow>Use the green create button below."]
  picker-empty-name: "<white>No saved items available"
  picker-empty-lore: ["<gray>Create an item in its library first.","<gray>Then return here to choose it."]
  locked-name: "<red>You do not have access to this control."
  enabled: "<green>ON"
  disabled: "<gray>OFF"
