# A choice is made only when creating or explicitly randomizing an NPC.
# IDs such as guard_1 stay unchanged. Existing saved actors are not randomized on upgrade.
# Internal file-format version; keep the shipped value.
schema: 1
# Assign a random username and skin when creating an NPC; false uses its actor ID as the name.
enabled: true
# Fetch username candidates from Random User v1.4 and Minecraft skin-owner accounts from Craftdex.
# Provider calls are bounded, asynchronous, cached, and never block actor creation.
api-enabled: true
# Network connect/read timeout in milliseconds for each public provider request (500..10000).
api-timeout-millis: 4000
# Refresh cached public usernames and skin owners after this many minutes (1..1440).
api-refresh-minutes: 30
# Local fallback names are 5..16 characters with a letter plus a digit/underscore.
# They are used while the public API cache is empty.
# All generated names skip current actors/nicknames, the blacklist, dead identities,
# every real account known to have joined this server, and current operators.
# First-half fragments for readable fallback names. Avoid empty strings.
name-prefixes: [Amber, Arctic, Ash, Azure, Birch, Cedar, Copper, Coral, Dusk, Ember, Fern, Frost, Golden, Ivory, Jade, Lunar, Maple, Moss, Oak, River, Silver, Storm, Violet, Winter]
# Second-half fragments; each prefix+suffix must be at most 15 characters before its required digit.
# Fallback output is lower-case and receives a digit or underscore, avoiding CapitalCapital names.
name-suffixes: [Badger, Bear, Birch, Brook, Crow, Deer, Dove, Falcon, Finch, Fox, Hare, Hawk, Heron, Lynx, Oak, Otter, Owl, Pine, Raven, Reed, Robin, Sparrow, Willow, Wolf, Ace, Arrow, Blade, Bolt, Comet, Dash, Drift, Echo, Flame, Forge, Glider, Knight, Leaf, Nova, Orbit, Pilot, Pixel, Quest, Rider, Rune, Scout, Spark, Stone, Wave]
# Actual Java account names, NOT invented NPC usernames. Citizens fetches their skins.
# Used only if the public skin-owner pool is unavailable. Replace or expand it with accounts whose
# current skins you want. Several actors can share a skin; displayed usernames remain independent.
skin-owners: [Notch, jeb_, Dinnerbone, Grumm, MHF_Steve, MHF_Alex]
